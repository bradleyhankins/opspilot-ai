<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="50" y="70" font-family="Arial" font-size="34" font-weight="800" fill="#111827">AI operations diagnosis</text><text x="50" y="105" font-family="Arial" font-size="18" fill="#4b5563">Rules-based diagnosis that turns KPI gaps into manager actions and coaching focus.</text><g font-family="Arial"><rect x="50" y="140" width="340" height="120" rx="18" fill="#ffffff" stroke="#e5e7eb"/><text x="75" y="178" fill="#6b7280" font-size="15" font-weight="700">PRIMARY BOTTLENECK</text><text x="75" y="225" fill="#111827" font-size="30" font-weight="800">NSLI</text><rect x="430" y="140" width="340" height="120" rx="18" fill="#ffffff" stroke="#e5e7eb"/><text x="455" y="178" fill="#6b7280" font-size="15" font-weight="700">PRIORITY LEVEL</text><text x="455" y="225" fill="#111827" font-size="30" font-weight="800">Medium</text><rect x="810" y="140" width="340" height="120" rx="18" fill="#ffffff" stroke="#e5e7eb"/><text x="835" y="178" fill="#6b7280" font-size="15" font-weight="700">REP TO REVIEW</text><text x="835" y="225" fill="#111827" font-size="30" font-weight="800">Casey Nguyen</text></g><rect x="50" y="300" width="1100" height="285" rx="18" fill="#ffffff" stroke="#e5e7eb"/><rect x="50" y="300" width="7" height="285" fill="#111827"/><text x="82" y="345" font-family="Arial" font-size="24" font-weight="800" fill="#111827">Manager Diagnosis</text><text x="82" y="392" font-family="Arial" font-size="18" fill="#111827" font-weight="700">Likely cause:</text><text x="210" y="392" font-family="Arial" font-size="18" fill="#4b5563">Revenue per issued lead is below target due to source quality, conversion, or job size.</text><text x="82" y="440" font-family="Arial" font-size="18" fill="#111827" font-weight="700">Manager action:</text><text x="225" y="440" font-family="Arial" font-size="18" fill="#4b5563">Compare NSLI by rep and source. Protect high-performing sources.</text><text x="82" y="488" font-family="Arial" font-size="18" fill="#111827" font-weight="700">Coaching move:</text><text x="220" y="488" font-family="Arial" font-size="18" fill="#4b5563">Prioritize high-intent opportunities, follow-up speed, and conversion discipline.</text><text x="82" y="536" font-family="Arial" font-size="18" fill="#111827" font-weight="700">Roleplay:</text><text x="170" y="536" font-family="Arial" font-size="18" fill="#4b5563">“I’m not sure if this is something we’re ready to do right now.”</text></svg>