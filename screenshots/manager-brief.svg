<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="50" y="70" font-family="Arial" font-size="34" font-weight="800" fill="#111827">Manager brief</text><text x="50" y="105" font-family="Arial" font-size="18" fill="#4b5563">Executive summary for fast manager review and meeting preparation.</text><rect x="50" y="145" width="1100" height="405" rx="20" fill="#ffffff" stroke="#e5e7eb"/><rect x="50" y="145" width="7" height="405" fill="#111827"/><text x="82" y="195" font-family="Arial" font-size="27" font-weight="800" fill="#111827">Executive Summary</text><text x="82" y="245" font-family="Arial" font-size="20" fill="#4b5563">The team generated $412,500 from 25 sales on 119 leads issued.</text><text x="82" y="310" font-family="Arial" font-size="19" fill="#111827" font-weight="800">Top revenue producer:</text><text x="295" y="310" font-family="Arial" font-size="19" fill="#4b5563">Alex Carter at $120,500</text><text x="82" y="360" font-family="Arial" font-size="19" fill="#111827" font-weight="800">Rep to review:</text><text x="220" y="360" font-family="Arial" font-size="19" fill="#4b5563">Casey Nguyen based on lowest NSLI</text><text x="82" y="410" font-family="Arial" font-size="19" fill="#111827" font-weight="800">Strongest lead source:</text><text x="303" y="410" font-family="Arial" font-size="19" fill="#4b5563">Partner Lead at $5,773 NSLI</text><text x="82" y="460" font-family="Arial" font-size="19" fill="#111827" font-weight="800">Lead source to review:</text><text x="306" y="460" font-family="Arial" font-size="19" fill="#4b5563">Paid Search at $2,269 NSLI</text><rect x="82" y="585" width="1040" height="55" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="110" y="620" font-family="Arial" font-size="18" fill="#334155" font-weight="700">Output:</text><text x="190" y="620" font-family="Arial" font-size="18" fill="#475569">Highlights what to protect, what to review, and where coaching should focus.</text></svg>