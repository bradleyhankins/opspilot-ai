<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8fafc"/><text x="50" y="70" font-family="Arial" font-size="34" font-weight="800" fill="#111827">Weekly sales meeting agenda</text><text x="50" y="105" font-family="Arial" font-size="18" fill="#4b5563">Turns dashboard findings into a practical meeting structure for managers.</text><rect x="50" y="145" width="1100" height="430" rx="20" fill="#ffffff" stroke="#e5e7eb"/><rect x="50" y="145" width="7" height="430" fill="#111827"/><text x="82" y="195" font-family="Arial" font-size="27" font-weight="800" fill="#111827">Recommended Agenda</text><g font-family="Arial" font-size="20"><circle cx="96" cy="255" r="14" fill="#1d4ed8"/><text x="92" y="262" fill="#fff" font-size="16" font-weight="800">1</text><text x="130" y="262" fill="#111827" font-weight="800">Wins:</text><text x="190" y="262" fill="#4b5563">Recognize Alex Carter and Partner Lead.</text><circle cx="96" cy="315" r="14" fill="#1d4ed8"/><text x="92" y="322" fill="#fff" font-size="16" font-weight="800">2</text><text x="130" y="322" fill="#111827" font-weight="800">Numbers in focus:</text><text x="310" y="322" fill="#4b5563">Review demo rate, close rate, average sale, and NSLI.</text><circle cx="96" cy="375" r="14" fill="#1d4ed8"/><text x="92" y="382" fill="#fff" font-size="16" font-weight="800">3</text><text x="130" y="382" fill="#111827" font-weight="800">Bottleneck:</text><text x="245" y="382" fill="#4b5563">Focus on NSLI and source quality.</text><circle cx="96" cy="435" r="14" fill="#1d4ed8"/><text x="92" y="442" fill="#fff" font-size="16" font-weight="800">4</text><text x="130" y="442" fill="#111827" font-weight="800">Roleplay:</text><text x="230" y="442" fill="#4b5563">Customer says: I’m not sure if we’re ready right now.</text><circle cx="96" cy="495" r="14" fill="#1d4ed8"/><text x="92" y="502" fill="#fff" font-size="16" font-weight="800">5</text><text x="130" y="502" fill="#111827" font-weight="800">Action commitments:</text><text x="330" y="502" fill="#4b5563">Each rep commits to one measurable action.</text></g></svg>